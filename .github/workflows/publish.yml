name: publish.yml

# Publishes every @onivoro/* package to npm with provenance, through npm trusted publishing (OIDC).
# No npm token is stored here: each package trusts this workflow file in the npm-publish environment
# (see tools/npm-trust.sh). Runs when a v<version> release tag is pushed (npm run release:push).
#
# Hardening (see readme.md):
# - only repository admins can create v* tags (tag ruleset), and the npm-publish environment only
#   accepts v* tags, so a push to main or any other branch can never publish
# - the tag must match every package's version and point at a commit on main
# - build installs dependencies with no install scripts and has no id-token permission, so no
#   dependency code ever runs where an npm publish token can be minted
# - publish installs and checks out nothing; it only uploads the built dist/ tarballs
# - actions are pinned to commit SHAs

on:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: 24.20.0 # bundles npm 11.19.0; trusted publishing needs 11.5.1 or later

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check the tag matches every package version and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pkg in libs/*/*/package.json; do
            version=$(node -p "require('./$pkg').version")
            if [ "$TAG" != "v$version" ]; then
              echo "::error::$pkg is at $version but the tag is $TAG"
              exit 1
            fi
          done
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npx nx run-many -t build --projects='lib-server-*,lib-isomorphic-*,lib-browser-*' --skip-nx-cache
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/libs
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/libs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Skips versions already on npm, so rerunning the job after a partial failure picks up where it stopped
      - name: Publish
        run: |
          for pkg in dist/libs/*/*/package.json; do
            dir=$(dirname "$pkg")
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "skip: $name@$version is already on npm"
              continue
            fi
            echo "publish: $name@$version"
            (cd "$dir" && npm publish --access public --provenance --ignore-scripts)
          done
