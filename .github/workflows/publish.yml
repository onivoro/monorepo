name: publish.yml

# Publishes every @onivoro/* package to npm with provenance, through npm trusted publishing (OIDC).
# No npm token is stored here: each package trusts this workflow file in the npm-publish environment
# (see tools/npm-trust.sh). Runs on every push to main but only publishes when the shared version
# isn't on npm yet, so a push without a version bump builds nothing.
#
# Hardening (see readme.md):
# - build installs dependencies with no install scripts and has no id-token permission, so no
#   dependency code ever runs where an npm publish token can be minted
# - publish installs and checks out nothing; it only uploads the built dist/ tarballs
# - publish runs in the npm-publish environment, which only main can use and which needs an approval
# - actions are pinned to commit SHAs

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: 24.20.0 # bundles npm 11.19.0; trusted publishing needs 11.5.1 or later

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Find packages whose version is not on npm
        id: check
        run: |
          missing=0
          for pkg in libs/*/*/package.json; do
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            if [ -z "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "unpublished: $name@$version"
              missing=1
            fi
          done
          echo "publish=$missing" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.publish == '1'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - if: steps.check.outputs.publish == '1'
        run: npx nx run-many -t build --projects='lib-server-*,lib-isomorphic-*,lib-browser-*' --skip-nx-cache
        env:
          NX_DAEMON: 'false'
          NX_NO_CLOUD: 'true'

      - if: steps.check.outputs.publish == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/libs
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.publish == '1'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/libs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Skips versions already on npm, so a rerun after a partial failure picks up where it stopped
      - name: Publish
        run: |
          for pkg in dist/libs/*/*/package.json; do
            dir=$(dirname "$pkg")
            name=$(node -p "require('./$pkg').name")
            version=$(node -p "require('./$pkg').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "skip: $name@$version is already on npm"
              continue
            fi
            echo "publish: $name@$version"
            (cd "$dir" && npm publish --access public --provenance --ignore-scripts)
          done
